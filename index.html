<main><header><h1>Fourmiz</h1><dl class="stats"><div><dt>Fourmis</dt><dd id="population"></dd></div><div><dt>Réserve</dt><dd id="reserve"></dd></div><div><dt>Œufs</dt><dd id="eggs"></dd></div><div><dt>Larves</dt><dd id="larvae"></dd></div></dl></header>

<p role="status" id="status"></p></main>
<script>
// World coordinates are independent of screen pixels and simulation speed.
const W=100,H=70,NEST={x:38,y:39},TAU=Math.PI*2,STEP=1/30;
const clamp=(x,min,max)=>Math.max(min,Math.min(max,x));
function colony(random=Math.random){
  const ants=[], food=[], brood=[], scent=new Float32Array(W*H);
  let reserve=8,time=0,nextEgg=8,decay=0;
  const cols=W/2, rows=H/2, walls=new Set(), fields=new Map();
  const radius=.88, spacing=2*radius, bucketSize=4;
  const bucketCols=Math.ceil(W/bucketSize), bucketRows=Math.ceil(H/bucketSize);
  const buckets=Array.from({length:bucketCols*bucketRows},()=>new Set());
  function bucket(x,y){return Math.floor(x/bucketSize)+Math.floor(y/bucketSize)*bucketCols;}
  function nearby(x,y){
    const result=[];
    const col=Math.floor(x/bucketSize),row=Math.floor(y/bucketSize);
    for(let j=Math.max(0,row-1);j<=Math.min(bucketRows-1,row+1);j++){
      for(let i=Math.max(0,col-1);i<=Math.min(bucketCols-1,col+1);i++)result.push(...buckets[i+j*bucketCols]);
    }
    return result;
  }
  function openGround(x,y){
    if(x<radius || y<radius || x>W-radius || y>H-radius)return false;
    if(!walls.size)return true;
    for(let j=Math.max(0,Math.floor((y-radius)/2));j<=Math.min(rows-1,Math.floor((y+radius)/2));j++){
      for(let i=Math.max(0,Math.floor((x-radius)/2));i<=Math.min(cols-1,Math.floor((x+radius)/2));i++){
        if(!walls.has(i+j*cols))continue;
        const dx=x-clamp(x,2*i,2*i+2),dy=y-clamp(y,2*j,2*j+2);
        if(dx*dx+dy*dy<radius*radius)return false;
      }
    }
    return true;
  }
  function clearBody(x,y,other,ant){
    return other.every(b=>b===ant || (x-b.x)**2+(y-b.y)**2>=spacing**2);
  }
  function tile(x,y){return Math.floor(y/2)*cols+Math.floor(x/2);}
  function center(i){return {x:2*(i%cols)+1,y:2*Math.floor(i/cols)+1};}
  function neighbors(i){
    const x=i%cols, result=[];
    if(x>0)result.push(i-1);
    if(x<cols-1)result.push(i+1);
    if(i>=cols)result.push(i-cols);
    if(i<cols*(rows-1))result.push(i+cols);
    return result;
  }
  function paint(x,y,solid){
    const i=tile(clamp(x,0,W-.01),clamp(y,0,H-.01)), point=center(i);
    if(walls.has(i)===solid)return;
    if(solid){
      if(Math.hypot(point.x-NEST.x,point.y-NEST.y)<5 || food.some(f=>tile(f.x,f.y)===i))return;
      if(nearby(point.x,point.y).some(a=>{
        const dx=Math.max(0,Math.abs(a.x-point.x)-1),dy=Math.max(0,Math.abs(a.y-point.y)-1);
        return dx*dx+dy*dy<radius*radius;
      }))return;
      walls.add(i);

    }else walls.delete(i);
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){
      const j=cell(point.x-1+dx,point.y-1+dy);
      permeable[j]=!solid && outsideNest(j);
      scent[j]=trailX[j]=trailY[j]=0;
    }
    fields.clear();
  }
  function clearSegment(from,to){
    if(!walls.size)return true;
    const dx=to.x-from.x,dy=to.y-from.y,length=Math.hypot(dx,dy);
    for(let t=.35;t<length;t+=.5){
      if(!openGround(from.x+dx*t/length,from.y+dy*t/length))return false;
    }
    return openGround(to.x,to.y);
  }
  // A reverse distance field is shared by workers heading for the same place.
  function routeTo(ant,goal,dt){
    if(clearSegment(ant,goal)){aim(ant,goal.x,goal.y,dt);return;}
    const dest=tile(goal.x,goal.y),here=tile(ant.x,ant.y);
    if(here===dest){aim(ant,goal.x,goal.y,dt);return;}
    let distance=fields.get(dest);
    if(!distance){
      distance=new Int16Array(cols*rows).fill(-1);
      distance[dest]=0;
      const queue=[dest];
      for(let j=0;j<queue.length;j++){
        const i=queue[j];
        for(const n of neighbors(i)){
          if(distance[n]>=0 || walls.has(n))continue;
          distance[n]=distance[i]+1;queue.push(n);
        }
      }
      if(fields.size>=64)fields.clear();
      fields.set(dest,distance);
    }
    if(distance[here]<0){ant.activity='Cherche un passage';ant.a+=dt*(random()-.5)*3;return;}
    const next=neighbors(here).find(n=>distance[n]===distance[here]-1);
    const point=center(next);
    aim(ant,point.x,point.y,dt);
  }
  const dropRadius=5.2, exitRadius=8.2, trailStart=10;
  const trailX=new Float32Array(W*H),trailY=new Float32Array(W*H);
  // Scalar concentration and its two direction-weighted components diffuse together.
  const permeable=new Uint8Array(W*H);
  const scratch=new Float32Array(W*H);
  const halfLife=44, diffusivity=.075, markingRange=85;
  for(let i=0;i<permeable.length;i++)permeable[i]=outsideNest(i);
  function outsideNest(i){
    return Math.hypot(i%W+.5-NEST.x,Math.floor(i/W)+.5-NEST.y)>trailStart;
  }
  function ageTrails(dt){
    const fade=2**(-dt/halfLife),k=Math.min(.24,diffusivity*dt);
    for(const channel of [scent,trailX,trailY]){
      for(let i=0;i<channel.length;i++){
        const v=channel[i];
        let flux=0;
        if(permeable[i]){
          if(i%W && permeable[i-1])flux+=channel[i-1]-v;
          if(i%W<W-1 && permeable[i+1])flux+=channel[i+1]-v;
          if(i>=W && permeable[i-W])flux+=channel[i-W]-v;
          if(i<W*(H-1) && permeable[i+W])flux+=channel[i+W]-v;
        }
        scratch[i]=(v+k*flux)*fade;
      }
      channel.set(scratch);
    }
  }
  function deposit(i,amount,dx,dy){
    if(!permeable[i])return;
    const accepted=amount/(1+scent[i]/8);
    scent[i]+=accepted;
    trailX[i]+=accepted*dx;
    trailY[i]+=accepted*dy;
  }
  function recordLandmark(ant){
    const path=ant.homeward,last=path[path.length-1];
    if(last && Math.hypot(last.x-ant.x,last.y-ant.y)<3)return;
    const point={x:ant.x,y:ant.y};
    // Erase loops from the worker's own walk before committing it to memory.
    const seen=path.findIndex(p=>Math.hypot(p.x-point.x,p.y-point.y)<2);
    if(seen>=0)path.length=seen;
    if(path.length<128)path.push(point);
  }
  function finishTrip(ant){
    ant.deliveries++;
    ant.visits=ant.learnedSource===ant.memory?ant.visits+1:1;
    ant.learnedSource=ant.memory;
    ant.route=ant.homeward.reverse();
    ant.homeward=null;
    ant.urge=time+30+Math.min(ant.visits,5)*12;
    const fidelity=.65+.27*(1-Math.exp(-ant.visits/1.8));
    ant.cursor=random()<fidelity?0:ant.route.length;
    ant.searchUntil=0;
  }
  function recall(ant,dt){
    if(!ant.memory || ant.memory.amount<=0 || time>=ant.urge || ant.cursor>=ant.route.length)return false;
    let point=ant.route[ant.cursor];
    if(Math.hypot(point.x-ant.x,point.y-ant.y)<2.2){
      point=ant.route[++ant.cursor];
      if(!point)return false;
    }
    if(!clearSegment(ant,point)){
      if(!ant.searchUntil)ant.searchUntil=time+2;
      if(time>=ant.searchUntil){
        ant.cursor=ant.route.length;ant.searchUntil=0;return false;
      }
      ant.activity='Cherche un détour';
      ant.a+=dt*(1.5+Math.sin(time+ant.phase))*(ant.id%2?1:-1);
      return true;
    }
    ant.searchUntil=0;
    ant.activity='Reprend son chemin appris';
    aim(ant,point.x,point.y,dt);
    return true;
  }
  function markReturn(ant,oldX,oldY,step){
    recordLandmark(ant);
    ant.tripDistance+=step;
    const i=cell(ant.x,ant.y);
    if(!permeable[i])return;
    // A worker cannot reinforce one cell indefinitely by shuffling in a queue.
    const marked=ant.tripMarks.get(i)||0;
    const length=Math.min(step,1.6-marked);
    if(length<=0)return;
    ant.tripMarks.set(i,marked+length);
    const trafficFactor=.35+.65/(1+ant.encounters*.42);
    const dose=.92*length*Math.exp(-ant.tripDistance/markingRange)*trafficFactor;
    deposit(i,dose,(oldX-ant.x)/step,(oldY-ant.y)/step);
  }
  function readTrail(ant){
    let vx=0,vy=0,total=0;
    for(const offset of [-1,-.5,0,.5,1]){
      const a=ant.a+offset,dx=Math.cos(a),dy=Math.sin(a);
      for(const reach of [1.6,3.4]){
        const x=ant.x+reach*dx,y=ant.y+reach*dy;
        if(x<0||x>=W||y<0||y>=H)continue;
        if(walls.size && (!openGround(x,y)||!openGround((x+ant.x)/2,(y+ant.y)/2)))continue;
        const i=cell(x,y),c=scent[i];
        if(c<.04)continue;
        const tx=trailX[i]/c,ty=trailY[i]/c;
        const gain=c*c/(.7+c*c);
        const weight=gain*Math.max(.12,.5+.5*(tx*dx+ty*dy));
        vx+=(dx*.35+tx)*weight;vy+=(dy*.35+ty)*weight;total+=weight;
      }
    }
    if(total<.06 || Math.hypot(vx,vy)<.05)return 0;
    const delta=Math.atan2(vy,vx)-ant.a;
    return clamp(Math.atan2(Math.sin(delta),Math.cos(delta)),-1,1)*Math.min(1,total);
  }
  function leaveNest(ant){
    const radial=Math.atan2(ant.y-NEST.y,ant.x-NEST.x);
    const heading=radial+(random()-.5)*.65;
    ant.exit=null;
    for(const turn of [0,.6,-.6,1.2,-1.2,Math.PI]){
      const x=NEST.x+Math.cos(heading+turn)*(exitRadius+1);
      const y=NEST.y+Math.sin(heading+turn)*(exitRadius+1);
      if(!openGround(x,y))continue;
      ant.exit={x,y,until:time+4};break;
    }
  }
  function spawn(){
    const angle=random()*TAU;
    for(let n=0;n<100;n++){
      const r=Math.sqrt(12+n*.8),t=angle+n*2.39996;
      const x=NEST.x+r*Math.cos(t),y=NEST.y+r*Math.sin(t);
      if(!openGround(x,y)||!clearBody(x,y,nearby(x,y)))continue;
      const ant={id:ants.length+1,activity:'Explore',x,y,a:t,load:false,memory:null,urge:0,
        route:[],cursor:0,deliveries:0,visits:0,encounters:0,contacts:new Set(),
        stride:random()*TAU,phase:random()*TAU,pace:5.4+random()*1.2,passSide:0};
      leaveNest(ant);
      ants.push(ant);buckets[bucket(x,y)].add(ant);return true;
    }
    return false;
  }
  function seeds(x,y,amount=25){
    if(walls.has(tile(x,y)))return false;
    const old=food.find(f=>Math.hypot(x-f.x,y-f.y)<4);
    if(old)old.amount+=amount;
    else food.push({x,y,amount});
    return true;
  }
  function cell(x,y){return clamp(Math.floor(x),0,W-1)+W*clamp(Math.floor(y),0,H-1)}
  function aim(ant,x,y,dt){

    const bend=Math.min(1,Math.hypot(x-ant.x,y-ant.y)/6)*.27*Math.sin(time*1.35+ant.phase);
    const delta=Math.atan2(y-ant.y,x-ant.x)+bend-ant.a;
    ant.a+=clamp(Math.atan2(Math.sin(delta),Math.cos(delta)),-5*dt,5*dt);
  }
  for(let i=0;i<32;i++)spawn();
  seeds(51,35,44);seeds(75,19,75);seeds(23,17,60);
  function tick(dt){
    time+=dt;decay+=dt;
    if(decay>=.5){ageTrails(decay);decay=0;}
    for(const ant of ants){
      const dist=Math.hypot(ant.x-NEST.x,ant.y-NEST.y);
      if(ant.load){
        ant.activity='Rapporte une graine';
        routeTo(ant,NEST,dt);
        if(dist<=dropRadius){
          reserve++;ant.load=false;ant.tripMarks=null;finishTrip(ant);leaveNest(ant);
        }
      }else if(ant.exit && dist<exitRadius && time<ant.exit.until){
        ant.activity='Libère l’entrée du nid';
        routeTo(ant,ant.exit,dt);
      }else{
        ant.exit=null;
        const target=food.find(f=>Math.hypot(ant.x-f.x,ant.y-f.y)<5);
        if(target){
          ant.activity='Rejoint des graines';
          routeTo(ant,target,dt);
          if(Math.hypot(ant.x-target.x,ant.y-target.y)<1.5 && (!walls.size || tile(ant.x,ant.y)===tile(target.x,target.y))){
            ant.load=true;ant.homeward=[{x:ant.x,y:ant.y}];ant.tripDistance=0;ant.tripMarks=new Map();
            ant.memory=target;ant.urge=time+32;
            // Connect the seed pile to the actual pickup point (up to 1.5 units).
            const dx=target.x-ant.x,dy=target.y-ant.y,len=Math.hypot(dx,dy)||1;
            for(let t=0;t<=1;t+=.5)deposit(cell(ant.x+t*dx,ant.y+t*dy),.35,dx/len,dy/len);
            if(--target.amount===0)food.splice(food.indexOf(target),1);
          }
        }else if(!recall(ant,dt)){
          const following=dist>=trailStart && scent[cell(ant.x,ant.y)]>.07;
          const turn=dist>=trailStart?readTrail(ant):0;
          ant.activity=following||Math.abs(turn)>.02?'Suit une piste':'Explore';
          if(dist<trailStart){
            ant.activity='S’éloigne du nid';
            const outward=Math.atan2(ant.y-NEST.y,ant.x-NEST.x);
            aim(ant,NEST.x+14*Math.cos(outward),NEST.y+14*Math.sin(outward),dt);
          }else ant.a+=dt*(turn*4+(following ? .28 : 1)*(1.3*Math.sin(time*1.4+ant.phase)+.85*Math.sin(time*.57+ant.id)));
        }
      }
      const local=nearby(ant.x,ant.y);
      const forwardX=Math.cos(ant.a),forwardY=Math.sin(ant.a);
      ant.encounters*=Math.exp(-dt/4);
      for(const previous of ant.contacts){
        if(Math.hypot(previous.x-ant.x,previous.y-ant.y)>2.9)ant.contacts.delete(previous);
      }
      let avoidance=0;
      for(const other of local){
        if(other===ant)continue;
        const dx=other.x-ant.x,dy=other.y-ant.y;
        const ahead=dx*forwardX+dy*forwardY,side=dy*forwardX-dx*forwardY;
        if(ahead>0 && dx*dx+dy*dy<2.35**2 && !ant.contacts.has(other)){
          ant.contacts.add(other);
          ant.encounters=Math.min(10,ant.encounters+1);
        }
        if(ahead>0 && ahead<3.6 && Math.abs(side)<spacing+.25){
          // Head-on workers both keep right. Otherwise turn away from the neighbour.
          const sign=Math.abs(side)<.4?1:-Math.sign(side);
          avoidance+=sign*(1-ahead/4)*(1-Math.abs(side)/(spacing+.25));
        }
      }
      ant.a+=clamp(avoidance,-1,1)*dt*5.8;

      const step=dt*ant.pace*(1-.28*Math.min(1,Math.abs(avoidance)));
      // Try a short sideways step when the forward lane is occupied. Keep
      // the same passing side until the worker can advance freely again.
      let nx,ny,found=false;
      const side=ant.passSide || (ant.id%2===0?1:-1);
      const angles=[0,.52*side,-.52*side,1.05*side,-1.05*side,1.58*side,-1.58*side,2.35*side,-2.35*side,Math.PI];
      for(const offset of angles){
        const heading=ant.a+offset;
        nx=ant.x+Math.cos(heading)*step;ny=ant.y+Math.sin(heading)*step;
        if(!openGround(nx,ny)||!clearBody(nx,ny,local,ant))continue;
        ant.a+=clamp(offset,-6*dt,6*dt);
        if(offset)ant.passSide=Math.sign(offset);
        found=true;break;
      }
      if(!found)continue;
      const old=bucket(ant.x,ant.y),next=bucket(nx,ny);
      if(old!==next){buckets[old].delete(ant);buckets[next].add(ant);}
      const oldX=ant.x,oldY=ant.y;
      ant.x=nx;ant.y=ny;
      if(ant.load)markReturn(ant,oldX,oldY,step);
      ant.stride=(ant.stride+step*4.4)%TAU;
    }
    if(time>=nextEgg){
      nextEgg=time+8;
      if(reserve>=2 && ants.length+brood.length<180){reserve--;brood.push({age:0});}
    }
    for(let i=brood.length-1;i>=0;i--){
      const b=brood[i];b.age+=dt;
      if(b.age>=22 && reserve>=2 && spawn()){reserve-=2;brood.splice(i,1);}
    }
  }
  return {ants,food,brood,scent,seeds,tick,walls,paint,center,get time(){return time},get reserve(){return reserve}};
}
</script>
<script>
const get=id=>document.getElementById(id),field=get('field'),ctx=field.getContext('2d'),world=colony();
let paused=false,speed=1,showTrails=true,last=null,elapsed=0,backdrop;
let tool='seeds',selected=null,stroke=null;
let relief=true, landscape;
function project(x,y,z=0){
  const depth=y/H, scale=1/(1.22-.22*depth);
  const elevation=Math.min(field.width/W,field.height/H)*scale;
  return {x:field.width*(.5+.96*(x/W-.5)*scale),
    y:field.height*(.11+.77*depth*scale)-z*elevation*.9, scale:elevation};
}
function face(c,vertices,color){
  c.beginPath();
  vertices.forEach(([x,y,z],i)=>{
    const p=project(x,y,z);
    if(i)c.lineTo(p.x,p.y);else c.moveTo(p.x,p.y);
  });
  c.closePath();c.fillStyle=color;c.fill();
}
function ellipse(c,x,y,rx,ry,color,rotation=0){
  c.beginPath();c.ellipse(x,y,rx,ry,rotation,0,TAU);c.fillStyle=color;c.fill();
}
function buildLandscape(){
  landscape=document.createElement('canvas');
  landscape.width=field.width;landscape.height=field.height;
  const c=landscape.getContext('2d');
  const bg=c.createLinearGradient(0,0,0,field.height);
  bg.addColorStop(0,'#213a32');bg.addColorStop(1,'#101d1a');
  c.fillStyle=bg;c.fillRect(0,0,field.width,field.height);
  ellipse(c,field.width*.51,field.height*.91,field.width*.47,field.height*.035,'#0e1916');
  const slice=(z1,z2,color)=>face(c,[[0,H,z1],[W,H,z1],[W,H,z2],[0,H,z2]],color);
  slice(0,-1.3,'#a88454');slice(-1.3,-3.7,'#896449');slice(-3.7,-5.4,'#684c3e');
  const ground=c.createLinearGradient(0,0,field.width,field.height);
  ground.addColorStop(0,'#bbbe86');ground.addColorStop(.35,'#e4d4a4');ground.addColorStop(.76,'#e2c693');ground.addColorStop(1,'#b7b17c');
  face(c,[[0,0,0],[W,0,0],[W,H,0],[0,H,0]],ground);
  let seed=733;const rand=()=>((seed=seed*16807%2147483647)/2147483647);
  for(let i=0;i<85;i++){
    const x=rand()*W,y=rand()*H,r=1+rand()*2.8;
    if(x<r||x>W-r||y<r||y>H-r)continue;
    const p=project(x,y);
    ellipse(c,p.x,p.y,p.scale*r,p.scale*r*.45,'#af915313',rand()*.7);
  }
  for(let i=0;i<1550;i++){
    const p=project(1+rand()*(W-2),1+rand()*(H-2));
    const size=(.09+rand()*.25)*p.scale;
    ellipse(c,p.x,p.y,size,size*.52,i%3?'#8359332b':'#fff2c981');
  }
  // Fold each leaf along a raised midrib to catch the light on one side.
  for(const [x,y,length,angle] of [[6,5,7,.7],[12,4,5,2.4],[92,8,6,2.6],[94,59,5,-2.3],[5,60,6,-.65],[9,62,4,-2.15]]){
    const leaf=(t,w,z)=>[x+length*t*Math.cos(angle)-w*Math.sin(angle),
      y+length*t*Math.sin(angle)+w*Math.cos(angle),z];
    const root=leaf(0,0,0),tip=leaf(1,0,.3),ridge=leaf(.54,0,1);
    for(const side of [-1,1]){
      face(c,[root,leaf(.26,side*1.15,.25),leaf(.65,side*1.4,.5),tip,ridge],side>0?'#788456':'#94a06c');
    }
  }
  // Frame the clearing with small clumps of grass along the outer banks.
  for(let i=0;i<100;i++){
    const x=rand()*W,y=rand()*H;
    if(x>6&&x<W-5&&y>6&&y<H-4)continue;
    for(let j=0;j<6;j++){
      const dx=(rand()-.5)*2,dy=(rand()-.5)*2;
      face(c,[[x+dx,y+dy,0],[x+dx+.45,y+dy,0],[x+dx*1.7,y+dy,1+rand()*2]],j%2?'#68764c':'#86905c');
    }
  }
}
function mound(){
  const {x,y}=NEST, count=16;
  const ring=(i,r,z)=>[x+r*Math.cos(TAU*i/count),y+r*Math.sin(TAU*i/count),z];
  const facets=Array.from({length:count},(_,i)=>i).sort((a,b)=>Math.sin(TAU*(a+.5)/count)-Math.sin(TAU*(b+.5)/count));
  for(const [outer,inner,bottom,top] of [[5.2,3.8,0,1.4],[3.8,1.8,1.4,2.9]]){
    for(const i of facets){
      const light=Math.round(51-10*Math.cos(TAU*(i+.5)/count)-7*Math.sin(TAU*(i+.5)/count));
      face(ctx,[ring(i,outer,bottom),ring(i+1,outer,bottom),ring(i+1,inner,top),ring(i,inner,top)],'hsl(32 41% '+light+'%)');
    }
  }
  face(ctx,facets.map((_,i)=>ring(i,1.8,2.9)),'#392b22');
}
function stone(i){
  const {x,y}=world.center(i),z=1.7+.25*Math.sin(i*7);
  face(ctx,[[x-1,y+1,0],[x+1,y+1,0],[x+.9,y+.8,z],[x-.8,y+.8,z]],'#655e50');
  face(ctx,[[x+1,y-1,0],[x+1,y+1,0],[x+.9,y+.8,z],[x+.85,y-.75,z]],'#7a7565');
  face(ctx,[[x-.9,y-.78,z],[x+.85,y-.75,z],[x+.9,y+.8,z],[x-.8,y+.8,z]],'#aaa48d');
}
const trailLayer=document.createElement('canvas');
trailLayer.width=W;trailLayer.height=H;
const trailContext=trailLayer.getContext('2d'),trailPixels=trailContext.createImageData(W,H);
let lastTrailPaint=-Infinity;
function drawTrails(perspective){
  if(world.time-lastTrailPaint>=.12){
    const pixels=trailPixels.data;
    for(let i=0;i<world.scent.length;i++){
      const v=world.scent[i],j=i*4;
      pixels[j]=25;pixels[j+1]=115;pixels[j+2]=95;
      pixels[j+3]=v<.025?0:205*v/(v+1.25);
    }
    trailContext.putImageData(trailPixels,0,0);lastTrailPaint=world.time;
  }
  if(!perspective){ctx.drawImage(trailLayer,0,0,field.width,field.height);return;}
  for(let row=0;row<H;row++){
    const left=project(0,row),right=project(W,row+1);
    ctx.drawImage(trailLayer,0,row,W,1,left.x,left.y,right.x-left.x,right.y-left.y+.3);
  }
}
function drawRelief(){
  ctx.drawImage(landscape,0,0);
  if(showTrails)drawTrails(true);
  const objects=[{y:NEST.y,draw:mound}];
  for(const i of world.walls)objects.push({y:world.center(i).y,draw:()=>stone(i)});
  for(const f of world.food)objects.push({y:f.y,draw:()=>{
    for(let j=0;j<Math.min(19,Math.ceil(f.amount/3));j++){
      const angle=j*2.4,r=Math.sqrt(j)*.48;
      const p=project(f.x+r*Math.cos(angle),f.y+r*Math.sin(angle),.3);
      ellipse(ctx,p.x,p.y,.74*p.scale,.42*p.scale,j%2?'#687a3b':'#4c6537',angle);
      ellipse(ctx,p.x-.11*p.scale,p.y-.14*p.scale,.40*p.scale,.10*p.scale,'#adb76d',angle);
    }
  }});
  for(const a of world.ants)objects.push({y:a.y,draw:()=>{
    const p=project(a.x,a.y,.19),ahead=project(a.x+Math.cos(a.a),a.y+Math.sin(a.a),.19);
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.scale,p.scale);
    ellipse(ctx,.36,.46,1.2,.38,'#614c3638',Math.atan2(ahead.y-p.y,ahead.x-p.x));
    ctx.rotate(Math.atan2(ahead.y-p.y,ahead.x-p.x));
    ctx.strokeStyle='#48372c';ctx.lineWidth=.14;ctx.beginPath();
    for(const side of [-1,1])for(const x of [-.45,0,.45]){
      const swing=.27*Math.sin(a.stride+(x===0?Math.PI:0)+(side<0?Math.PI:0));
      ctx.moveTo(x,0);ctx.lineTo(x+.14+swing*.5,side*.43);ctx.lineTo(x-.11+swing,side*.73);
    }
    ctx.stroke();
    ellipse(ctx,-.58,0,.58,.37,'#382a25');ellipse(ctx,-.67,-.09,.28,.09,'#996d53');
    ellipse(ctx,.13,0,.32,.27,'#8b583c');ellipse(ctx,.60,0,.31,.29,'#422e26');
    if(a.load)ellipse(ctx,1.04,-.06,.39,.23,'#8b9f4c',-.6);
    ctx.restore();
  }});
  objects.sort((a,b)=>a.y-b.y);
  for(const o of objects)o.draw();
}

function resize(){
  const r=field.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
  field.width=Math.max(1,Math.round(r.width*d));field.height=Math.max(1,Math.round(r.height*d));
  backdrop=document.createElement('canvas');backdrop.width=field.width;backdrop.height=field.height;
  const b=backdrop.getContext('2d'),g=b.createRadialGradient(field.width*.4,field.height*.55,0,field.width*.4,field.height*.55,field.width);
  g.addColorStop(0,'#ede1bb');g.addColorStop(1,'#c9bc94');b.fillStyle=g;b.fillRect(0,0,field.width,field.height);
  let seed=731;const rand=()=>((seed=seed*16807%2147483647)/2147483647);
  for(let i=0;i<1800;i++){b.fillStyle=i%4?'#5b513317':'#fff5cf77';b.beginPath();b.arc(rand()*field.width,rand()*field.height,(.3+rand())*d,0,TAU);b.fill();}
  buildLandscape();draw();
}
function dot(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=color;ctx.fill();}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  const sx=field.width/W,sy=field.height/H,u=Math.min(sx,sy);
  if(relief)drawRelief();
  else {
  ctx.drawImage(backdrop,0,0);
  if(showTrails)drawTrails(false);
  for(const i of world.walls){
    const p=world.center(i);ctx.fillStyle='#645e50';
    ctx.fillRect((p.x-1)*sx,(p.y-1)*sy,2*sx+.3,2*sy+.3);
    ctx.fillStyle='#817b6a';ctx.fillRect((p.x-.84)*sx,(p.y-.82)*sy,1.5*sx,.35*sy);
  }
  const nx=NEST.x*sx,ny=NEST.y*sy;
  for(const [r,c] of [[4.6,'#a18456'],[3.6,'#c69b62'],[2.6,'#97693f'],[1.7,'#392f23']])dot(nx,ny,r*u,c);
  for(const f of world.food){const n=Math.min(19,Math.ceil(f.amount/3));
    for(let j=0;j<n;j++){const a=j*2.4,r=Math.sqrt(j)*.46*u;
      dot(f.x*sx+Math.cos(a)*r,f.y*sy+Math.sin(a)*r,.57*u,j%2?'#67833a':'#435d2e');}}
  for(const ant of world.ants){
    ctx.save();ctx.translate(ant.x*sx,ant.y*sy);ctx.rotate(Math.atan2(Math.sin(ant.a)*sy,Math.cos(ant.a)*sx));ctx.scale(u,u);
    ctx.strokeStyle='#513628';ctx.lineWidth=.12;ctx.beginPath();
    for(const s of [-1,1])for(const x of [-.36,0,.36]){const swing=.27*Math.sin(ant.stride+(x===0?Math.PI:0)+(s<0?Math.PI:0));ctx.moveTo(x,0);ctx.lineTo(x+.16+swing*.5,s*.45);ctx.lineTo(x-.08+swing,s*.66);}
    ctx.stroke();dot(-.49,0,.35,'#473326');dot(.02,0,.24,'#79503b');dot(.47,0,.28,'#3d3028');if(ant.load)dot(.84,0,.25,'#749632');ctx.restore();
  }
  }
  if(selected){
    const at=relief?project(selected.x,selected.y):{x:selected.x*sx,y:selected.y*sy};
    ctx.beginPath();ctx.arc(at.x,at.y,Math.max(2*u,9*field.width/field.clientWidth),0,TAU);
    ctx.strokeStyle='#71351d';ctx.lineWidth=Math.max(1,u*.35);ctx.stroke();
    const trips=selected.deliveries===1?'1 livraison':selected.deliveries+' livraisons';
    const traffic=selected.load && selected.encounters>=1?' · Marquage réduit':'';
    const label='Ouvrière '+selected.id+' · '+selected.activity+' · '+trips+traffic;
    if(get('observer').textContent!==label)get('observer').textContent=label;
  }
  const eggs=world.brood.filter(b=>b.age<9).length;
  for(const [id,n] of [['population',world.ants.length],['reserve',world.reserve],['eggs',eggs],['larvae',world.brood.length-eggs]]){
    if(get(id).textContent!==String(n))get(id).textContent=n;
  }
}
function frame(now){
  if(last!==null&&!paused){elapsed+=Math.min((now-last)/1000,.12)*speed;
    while(elapsed>=STEP){world.tick(STEP);elapsed-=STEP;}}
  last=now;if(!paused)draw();requestAnimationFrame(frame);
}
function add(x,y){
  const ok=world.seeds(clamp(x,2,W-2),clamp(y,2,H-2));
  get('status').textContent=ok?'25 graines déposées.':'Choisis du terrain libre.';
  draw();
}
const hints={seeds:'Touche le sol pour déposer des graines.',wall:'Glisse le doigt pour tracer un mur.',erase:'Glisse sur un mur pour ouvrir un passage.',follow:'Touche une ouvrière pour suivre son activité.'};
for(const button of document.querySelectorAll('[data-tool]')){
  button.onclick=()=>{
    tool=button.dataset.tool;
    for(const other of document.querySelectorAll('[data-tool]'))other.setAttribute('aria-pressed',String(other===button));
    get('hint').textContent=hints[tool];get('status').textContent='';
    if(tool!=='follow'){selected=null;get('observer').hidden=true;}
    draw();
  };
}
function position(e){
  const r=field.getBoundingClientRect();
  if(relief){
    const t=((e.clientY-r.top)/r.height-.11)/.77;
    const depth=1.22*t/(1+.22*t);
    return {x:W*(.5+((e.clientX-r.left)/r.width-.5)*(1.22-.22*depth)/.96),y:H*depth};
  }
  return {x:clamp((e.clientX-r.left)*W/r.width,0,W-.01),y:clamp((e.clientY-r.top)*H/r.height,0,H-.01)};
}
function drag(to){
  const from=stroke.point,steps=Math.max(1,Math.ceil(Math.hypot(to.x-from.x,to.y-from.y)*2));
  for(let i=1;i<=steps;i++)world.paint(from.x+(to.x-from.x)*i/steps,from.y+(to.y-from.y)*i/steps,tool==='wall');
  stroke.point=to;
  lastTrailPaint=-Infinity;
  if(paused)draw();
}
field.addEventListener('pointerdown',e=>{
  if(!e.isPrimary || e.button!==0 || stroke)return;
  const p=position(e);
  if(p.x<0||p.x>=W||p.y<0||p.y>=H)return;
  stroke={id:e.pointerId,point:p};field.setPointerCapture(e.pointerId);
  if(tool==='wall'||tool==='erase')drag(p);
});
field.addEventListener('pointermove',e=>{
  if(stroke?.id===e.pointerId && (tool==='wall'||tool==='erase'))drag(position(e));
});
field.addEventListener('pointerup',e=>{
  if(stroke?.id!==e.pointerId)return;
  const p=position(e);
  if(p.x<0||p.x>=W||p.y<0||p.y>=H){stroke=null;return;}
  if(tool==='wall'||tool==='erase')drag(p);
  else if(tool==='seeds')add(p.x,p.y);
  else{
    let best=24;selected=null;
    for(const ant of world.ants){
      const screen=relief?project(ant.x,ant.y):{x:ant.x*field.width/W,y:ant.y*field.height/H};
      const box=field.getBoundingClientRect();
      const d=Math.hypot(screen.x*box.width/field.width+box.left-e.clientX,screen.y*box.height/field.height+box.top-e.clientY);
      if(d<best){best=d;selected=ant;}
    }
    get('observer').hidden=!selected;
    get('status').textContent=selected?'':'Touche plus près d’une ouvrière.';
    draw();
  }
  stroke=null;
});
field.addEventListener('lostpointercapture',e=>{if(stroke?.id===e.pointerId)stroke=null;});
get('feed').onclick=()=>add(8+Math.random()*84,8+Math.random()*54);
get('pause').onclick=()=>{paused=!paused;get('pause').textContent=paused?'Reprendre':'Pause';last=null;};
get('speed').onclick=()=>{speed=speed===4?1:speed*2;get('speed').textContent='Vitesse ×'+speed;};
get('relief').onclick=()=>{relief=!relief;get('relief').setAttribute('aria-pressed',String(relief));draw();};
get('trails').onclick=()=>{showTrails=!showTrails;get('trails').setAttribute('aria-pressed',String(showTrails));draw();};
document.addEventListener('visibilitychange',()=>{last=null;});
new ResizeObserver(resize).observe(field);resize();requestAnimationFrame(frame);
</script></html>
